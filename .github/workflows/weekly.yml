name: Weekly Summary Email

on:
  schedule:
    # Multiple Saturday UTC slots so delayed Actions runners still hit morning ET.
    # Script uses --force because the schedule already gates to Saturday.
    - cron: "0 14,15,16,17 * * 6"
  workflow_dispatch:
  # Catch-up send when the weekly email path itself is fixed/updated.
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly.yml"
      - "app/weekly_report.py"
      - "app/timezone_utils.py"
      - "app/notifier.py"

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send weekly report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        # --force: cron/push already decide when to run; do not skip on delayed hour.
        run: python -m app.weekly_report --send --force
